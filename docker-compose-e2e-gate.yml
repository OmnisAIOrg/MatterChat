# Minimal CE stack for the pre-merge Playwright gate (.github/workflows/e2e-gate.yml).
#
# Differences from upstream docker-compose-ci.yml (kept as-is for upstream merges):
#   - no traefik: the CE monolith serves HTTP + websockets itself, so we map :3000 directly.
#   - no EE micro-services (authorization/account/presence/ddp-streamer/queue-worker/nats):
#     those exist only for the EE TRANSPORTER topology we don't license.
#   - image comes from the local buildx build of apps/meteor/.docker/Dockerfile.alpha
#     (the same Dockerfile the staging deploy uses), overridable via E2E_GATE_IMAGE.
#
# Mongo is exposed on 27017 because the Playwright globalSetup (inject-initial-data.ts)
# seeds users/settings by connecting to Mongo directly from the runner.
services:
  mongo:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-8.0}-ubi8
    restart: on-failure
    ports:
      - '27017:27017'
    environment:
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_PORT_NUMBER: 27017
      MONGODB_INITIAL_PRIMARY_HOST: mongo
    # same single-node replica-set bootstrap as upstream docker-compose-ci.yml
    entrypoint: |
      bash -c
        "mongod --replSet rs0 --bind_ip_all &
          sleep 2;
          until mongosh --eval \"db.adminCommand('ping')\"; do
            echo '=====> Waiting for Mongo...';
            sleep 1;
          done;
          echo '=====> Initiating ReplSet rs0 at mongo:27017...';
          mongosh --eval \"rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }]})\";
          echo '=====> Initiating ReplSet done...';
        wait"

  rocketchat:
    image: ${E2E_GATE_IMAGE:-matterchat-e2e:pr}
    depends_on:
      - mongo
    ports:
      - '3000:3000'
    environment:
      - TEST_MODE=true
      - DEPLOY_METHOD=docker
      - MONGO_URL=mongodb://mongo:27017/rocketchat?replicaSet=rs0
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - EXIT_UNHANDLEDPROMISEREJECTION=true
      - OVERWRITE_SETTING_Log_Level=${DEBUG_LOG_LEVEL:-0}
      - HEAP_USAGE_PERCENT=99
    healthcheck:
      # curl is present in the Dockerfile.alpha runtime stage
      test: curl -fsS http://127.0.0.1:3000/livez || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      # first boot runs migrations + seeds; give it room
      start_period: 180s
