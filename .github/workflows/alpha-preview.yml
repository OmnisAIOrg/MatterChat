name: Alpha Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_target:
    types: [edited]

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only run for feature/* branches
    if: startsWith(github.event.pull_request.head.ref, 'feature/')
    steps:
      - name: Trigger Preview Environment
        id: trigger
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGES_BODY: ${{ github.event.changes.body.from || '' }}
          ACTION: ${{ github.event.action }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "============================================"
          echo "  ALPHA PREVIEW ENVIRONMENT"
          echo "============================================"
          echo "Repo:      $REPO"
          echo "PR:        #$PR_NUM - $TITLE"
          echo "Branch:    $BRANCH"
          echo "Author:    $AUTHOR"
          echo "Triggered: $SENDER"
          echo "Commit:    ${COMMIT_SHA:0:7}"
          echo "Time:      $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "--------------------------------------------"

          if [ "$ACTION" = "edited" ]; then
            echo "REBUILD: PR description updated by $SENDER"
            OLD_BACKEND=$(echo "$CHANGES_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            if [ -n "$NEW_BACKEND" ]; then
              echo "Linked Backend PR: $NEW_BACKEND"
              if [ -n "$OLD_BACKEND" ] && [ "$OLD_BACKEND" != "$NEW_BACKEND" ]; then
                echo "Changed from:      $OLD_BACKEND"
              elif [ -z "$OLD_BACKEND" ]; then
                echo "(newly added backend link)"
              fi
            else
              echo "No linked backend PR in description"
            fi

          elif [ "$ACTION" = "synchronize" ]; then
            echo "REBUILD: New commit pushed by $SENDER"
            echo "Latest commit: ${COMMIT_SHA:0:7}"
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            [ -n "$NEW_BACKEND" ] && echo "Linked Backend PR: $NEW_BACKEND"

          elif [ "$ACTION" = "opened" ]; then
            echo "CREATE: New preview environment"
            echo "First commit: ${COMMIT_SHA:0:7}"
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            [ -n "$NEW_BACKEND" ] && echo "Linked Backend PR: $NEW_BACKEND"

          elif [ "$ACTION" = "reopened" ]; then
            echo "RECREATE: PR reopened by $SENDER"

          elif [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" = "true" ]; then
              echo "DESTROY: PR merged by $SENDER — cleaning up environment"
            else
              echo "DESTROY: PR closed by $SENDER — cleaning up environment"
            fi
          fi

          echo "--------------------------------------------"
          echo "Environment URL: https://pr-${PR_NUM}-$(echo $REPO | sed 's|.*/||' | tr '[:upper:]' '[:lower:]' | sed 's/-frontend/-fe/' | sed 's/-backend/-be/').alpha.stg-omnisai.io"
          echo "============================================"

          # Create JSON payload with proper escaping for PR body
          jq -n \
            --arg action "$ACTION" \
            --argjson number "$PR_NUM" \
            --arg ref "$BRANCH" \
            --arg login "$AUTHOR" \
            --arg title "$TITLE" \
            --arg body "$PR_BODY" \
            --arg repo "$REPO" \
            '{
              action: $action,
              pull_request: {
                number: $number,
                head: {ref: $ref},
                user: {login: $login},
                title: $title,
                body: $body
              },
              repository: {full_name: $repo}
            }' > /tmp/payload.json

          echo "Sending webhook to Alpha..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -d @/tmp/payload.json \
            https://webhook.alpha.stg-omnisai.io/webhook)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Webhook Response: $BODY (HTTP $HTTP_CODE)"
          echo "============================================"

          # Export for next step
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Monitor Build Progress
        if: steps.trigger.outputs.action != 'closed'
        env:
          PR_NUM: ${{ steps.trigger.outputs.pr_num }}
          REPO: ${{ steps.trigger.outputs.repo }}
        run: |
          STATUS_URL="https://webhook.alpha.stg-omnisai.io/status/${REPO}/${PR_NUM}"
          MAX_WAIT=1800  # 30 minutes max
          POLL_INTERVAL=15
          ELAPSED=0
          LAST_LOG_COUNT=0

          echo ""
          echo "============================================"
          echo "  MONITORING BUILD PROGRESS"
          echo "============================================"
          echo "Status endpoint: $STATUS_URL"
          echo "Polling every ${POLL_INTERVAL}s (max ${MAX_WAIT}s)"
          echo "--------------------------------------------"

          # Wait a bit for orchestrator to start processing
          sleep 20

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$STATUS_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" = "404" ]; then
              echo "[$(date -u '+%H:%M:%S')] Waiting for environment to be created..."
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            if [ "$HTTP_CODE" != "200" ]; then
              echo "[$(date -u '+%H:%M:%S')] Status check failed (HTTP $HTTP_CODE), retrying..."
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            ENV_URL=$(echo "$BODY" | jq -r '.url // ""')

            # Print new log lines since last check
            TOTAL_LOGS=$(echo "$BODY" | jq '.logs | length')
            if [ "$TOTAL_LOGS" -gt "$LAST_LOG_COUNT" ]; then
              echo "$BODY" | jq -r ".logs[$LAST_LOG_COUNT:][]" | while IFS= read -r log_line; do
                # Extract action and message from log format: [timestamp] env_id | ACTION | message
                ACTION_TAG=$(echo "$log_line" | sed 's/.*| \([A-Z_]*\) |.*/\1/')
                MSG=$(echo "$log_line" | sed 's/.*| [A-Z_]* | //')
                case "$ACTION_TAG" in
                  CREATE_START|REBUILD_START)  echo "::group::Build Started" ; echo "$MSG" ; echo "::endgroup::" ;;
                  BUILD_START)                 echo "[BUILD] $MSG" ;;
                  CLONE_*)                     echo "[CLONE] $MSG" ;;
                  CONTAINERS_STARTED)          echo "[DOCKER] $MSG" ;;
                  DB_COPY_*|POSTGRES_*|MONGO*) echo "[DATABASE] $MSG" ;;
                  MIGRATION_*|SCHEMA_*|SEED_*) echo "[MIGRATION] $MSG" ;;
                  CORS_*)                      echo "[CORS] $MSG" ;;
                  CLAUDE_*)                    echo "[AI] $MSG" ;;
                  CREATE_SUCCESS)              echo "::notice::$MSG" ;;
                  BUILD_ERROR|BUILD_TIMEOUT)   echo "::error::$MSG" ;;
                  *)                           echo "[$ACTION_TAG] $MSG" ;;
                esac
              done
              LAST_LOG_COUNT=$TOTAL_LOGS
            fi

            # Check terminal states
            if [ "$STATUS" = "running" ]; then
              echo ""
              echo "============================================"
              echo "  BUILD SUCCESSFUL"
              echo "============================================"

              # Print container status table
              echo ""
              echo "Container Status:"
              echo "--------------------------------------------"
              echo "$BODY" | jq -r '.containers[] | "  \(.state | ascii_upcase)\t\(.name)\t\(.status)"' | column -t -s $'\t'
              echo "--------------------------------------------"
              echo ""
              echo "Environment URL: $ENV_URL"
              echo "============================================"
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo ""
              echo "============================================"
              echo "  BUILD FAILED"
              echo "============================================"

              # Print container status table
              echo ""
              echo "Container Status:"
              echo "--------------------------------------------"
              echo "$BODY" | jq -r '.containers[] | "  \(.state | ascii_upcase)\t\(.name)\t\(.status)"' | column -t -s $'\t'
              echo "--------------------------------------------"

              # Print last 10 logs for debugging
              echo ""
              echo "Recent Logs:"
              echo "$BODY" | jq -r '.logs[-10:][]'
              echo "============================================"
              exit 1
            fi

            # Still building - show status indicator
            CONTAINER_COUNT=$(echo "$BODY" | jq '.containers | length')
            RUNNING_COUNT=$(echo "$BODY" | jq '[.containers[] | select(.state == "running")] | length')
            echo "[$(date -u '+%H:%M:%S')] Status: $STATUS | Containers: $RUNNING_COUNT/$CONTAINER_COUNT running"

            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "::error::Build monitoring timed out after ${MAX_WAIT}s"
          echo "Check environment manually at: $STATUS_URL"
          exit 1