name: Alpha Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_target:
    types: [edited]

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only run for feature/* branches
    if: startsWith(github.event.pull_request.head.ref, 'feature/')
    steps:
      - name: Trigger Preview Environment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGES_BODY: ${{ github.event.changes.body.from || '' }}
          ACTION: ${{ github.event.action }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "============================================"
          echo "  ALPHA PREVIEW ENVIRONMENT"
          echo "============================================"
          echo "Repo:      $REPO"
          echo "PR:        #$PR_NUM - $TITLE"
          echo "Branch:    $BRANCH"
          echo "Author:    $AUTHOR"
          echo "Triggered: $SENDER"
          echo "Commit:    ${COMMIT_SHA:0:7}"
          echo "Time:      $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "--------------------------------------------"

          if [ "$ACTION" = "edited" ]; then
            echo "REBUILD: PR description updated by $SENDER"
            OLD_BACKEND=$(echo "$CHANGES_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            if [ -n "$NEW_BACKEND" ]; then
              echo "Linked Backend PR: $NEW_BACKEND"
              if [ -n "$OLD_BACKEND" ] && [ "$OLD_BACKEND" != "$NEW_BACKEND" ]; then
                echo "Changed from:      $OLD_BACKEND"
              elif [ -z "$OLD_BACKEND" ]; then
                echo "(newly added backend link)"
              fi
            else
              echo "No linked backend PR in description"
            fi

          elif [ "$ACTION" = "synchronize" ]; then
            echo "REBUILD: New commit pushed by $SENDER"
            echo "Latest commit: ${COMMIT_SHA:0:7}"
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            [ -n "$NEW_BACKEND" ] && echo "Linked Backend PR: $NEW_BACKEND"

          elif [ "$ACTION" = "opened" ]; then
            echo "CREATE: New preview environment"
            echo "First commit: ${COMMIT_SHA:0:7}"
            NEW_BACKEND=$(echo "$PR_BODY" | grep -oP '(?:alpha-link-backend:\s*\S+#\d+|github\.com/\S+/pull/\d+)' | head -1 || true)
            [ -n "$NEW_BACKEND" ] && echo "Linked Backend PR: $NEW_BACKEND"

          elif [ "$ACTION" = "reopened" ]; then
            echo "RECREATE: PR reopened by $SENDER"

          elif [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" = "true" ]; then
              echo "DESTROY: PR merged by $SENDER — cleaning up environment"
            else
              echo "DESTROY: PR closed by $SENDER — cleaning up environment"
            fi
          fi

          echo "--------------------------------------------"
          echo "Environment URL: https://pr-${PR_NUM}-$(echo $REPO | sed 's|.*/||' | tr '[:upper:]' '[:lower:]' | sed 's/-frontend/-fe/' | sed 's/-backend/-be/').alpha.stg-omnisai.io"
          echo "============================================"

          # Create JSON payload with proper escaping for PR body
          jq -n \
            --arg action "$ACTION" \
            --argjson number "$PR_NUM" \
            --arg ref "$BRANCH" \
            --arg login "$AUTHOR" \
            --arg title "$TITLE" \
            --arg body "$PR_BODY" \
            --arg repo "$REPO" \
            '{
              action: $action,
              pull_request: {
                number: $number,
                head: {ref: $ref},
                user: {login: $login},
                title: $title,
                body: $body
              },
              repository: {full_name: $repo}
            }' > /tmp/payload.json

          echo "Sending webhook to Alpha..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -d @/tmp/payload.json \
            https://webhook.alpha.stg-omnisai.io/webhook)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Webhook Response: $BODY (HTTP $HTTP_CODE)"
          echo "============================================"
