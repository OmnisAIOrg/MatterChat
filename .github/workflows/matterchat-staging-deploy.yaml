name: MatterChat — Staging Deploy

# BUILD-ONLY (+ a safe pod restart). MatterChat staging is owned by ArgoCD — app
# `matterchat-staging`, synced from the OmnisAIOrg/MatterChat-New repo (kubernetes/staging/),
# with automated prune + selfHeal. ArgoCD owns the Deployment / Service(s) / Ingress.
#
# Therefore this pipeline must NOT `kubectl apply` the manifests under kubernetes/staging/ (a
# stale, divergent copy) nor `kubectl set image` — both FIGHT ArgoCD's self-heal. In particular
# the committed Ingress used the wrong shared-ALB group, so applying it flipped MatterChat onto the
# backend ALB and 404-ed the public host until the binding was repaired. (See the repo HANDOFF /
# memory "matterchat-staging-argocd-truth".)
#
# So we BUILD + push the image, then deploy it the only ArgoCD-safe way: restart the pod, so the
# ArgoCD-managed Deployment recreates it and pulls the new :staging-latest. Deleting a pod is
# invisible to ArgoCD (it reconciles Deployments/Services/Ingress, not individual pods).
#
# MatterChat's default branch is `develop`; this fires ONLY on `staging`.

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  ECR_REPOSITORY: matterchat
  K8S_NAMESPACE: staging

# Avoid two overlapping builds racing on the same image/pod.
concurrency:
  group: matterchat-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # ubuntu-latest is too small for a Meteor build (~20-35 min / 6 GB);
    # use the same large runner MatterChat's other workflows use.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha8=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/meteor/.docker/Dockerfile.alpha
          push: true
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ steps.vars.outputs.sha8 }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      # --- Deploy the freshly built image the ArgoCD-safe way: restart the pod ---------------------
      # NO `kubectl apply` of kubernetes/staging/* and NO `kubectl set image` (both fight ArgoCD).
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Roll the new image (restart pod; ArgoCD owns the manifests)
        run: kubectl delete pod -n "${K8S_NAMESPACE}" -l app=matterchat --wait=false

      - name: Wait for the new pod to serve /api/info
        run: |
          for i in $(seq 1 36); do
            code=$(curl -fsS -m 6 -o /dev/null -w '%{http_code}' "https://matterchat.stg-omnisai.io/api/info" 2>/dev/null || echo 000)
            echo "t=$((i*10))s  /api/info=$code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "app did not return 200 within ~6m after restart"; exit 1

      # On a failed roll, dump WHY the new pod did not become ready (boot crash vs scheduling vs
      # image pull) — pod state, events, and current + previous container logs.
      - name: Diagnose failed roll (pod state + crash logs)
        if: failure()
        run: |
          echo "===== pods ====="; kubectl get pods -n "${K8S_NAMESPACE}" -l app=matterchat -o wide 2>&1 || true
          echo "===== describe pod (events + state) ====="; kubectl describe pod -n "${K8S_NAMESPACE}" -l app=matterchat 2>&1 | tail -70 || true
          echo "===== current container logs ====="; kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --tail=140 2>&1 || true
          echo "===== previous (crashed) container logs ====="; kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --previous --tail=140 2>&1 || true
          echo "===== recent namespace events ====="; kubectl get events -n "${K8S_NAMESPACE}" --sort-by=.lastTimestamp 2>&1 | tail -30 || true
