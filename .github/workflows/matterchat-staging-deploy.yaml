name: MatterChat — Staging Deploy

# Mirrors the LitBox (OmnisAIOrg) staging deploy pattern:
# build the heavy Meteor image from source, push to ECR, apply the k8s
# manifests, then roll the mongo StatefulSet and the app Deployment.
#
# MatterChat's default branch is `develop`; this deploy fires ONLY on `staging`.

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  ECR_REPOSITORY: matterchat
  K8S_NAMESPACE: staging

# Avoid two overlapping deploys racing on the same cluster resources.
concurrency:
  group: matterchat-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # ubuntu-latest is too small for a Meteor build (~20-35 min / 6 GB);
    # use the same large runner MatterChat's other workflows use.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha8=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/meteor/.docker/Dockerfile.alpha
          push: true
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ steps.vars.outputs.sha8 }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Apply manifests (idempotent — creates on first run, updates after)
        run: |
          # A StatefulSet's immutable fields (serviceName/selector/volumeClaimTemplates/
          # podManagementPolicy) can't be changed via `apply`. If an incompatible
          # matterchat-mongo already exists (e.g. from an earlier partial setup), fall
          # back to delete + recreate. Deleting a StatefulSet does NOT delete its PVCs,
          # so any data is preserved and re-adopted by the new object.
          kubectl apply -f kubernetes/staging/matterchat-mongo.yaml || {
            echo "↻ Recreating matterchat-mongo StatefulSet (immutable-field change; PVCs persist)"
            kubectl delete statefulset matterchat-mongo -n "${K8S_NAMESPACE}" --ignore-not-found --wait=true
            kubectl apply -f kubernetes/staging/matterchat-mongo.yaml
          }
          # Same for the app Deployment: spec.selector is immutable, so an incompatible
          # pre-existing matterchat Deployment can't be `apply`d over. Delete + recreate
          # (this also re-applies the Service + Ingress in the file idempotently).
          kubectl apply -f kubernetes/staging/matterchat-deployment-staging.yaml || {
            echo "↻ Recreating matterchat Deployment (immutable selector change)"
            kubectl delete deployment matterchat -n "${K8S_NAMESPACE}" --ignore-not-found --wait=true
            kubectl apply -f kubernetes/staging/matterchat-deployment-staging.yaml
          }

      - name: Wait for MongoDB StatefulSet
        run: kubectl rollout status statefulset/matterchat-mongo -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Roll app to the freshly built image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:staging-${{ steps.vars.outputs.sha8 }}"
          kubectl set image deployment/matterchat matterchat="${IMAGE}" -n "${K8S_NAMESPACE}"

      - name: Wait for app rollout (Meteor boot + migrations are slow)
        run: kubectl rollout status deployment/matterchat -n "${K8S_NAMESPACE}" --timeout=600s
