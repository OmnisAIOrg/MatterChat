name: MatterChat — Staging Deploy

# Build the image, then roll it the way every other OmnisAI staging pipeline rolls one:
# `kubectl rollout restart` + `kubectl rollout status`. MatterChat staging is owned by the
# ArgoCD app `matterchat-staging`, synced from OmnisAIOrg/MatterChat-New (kubernetes/staging/)
# with automated prune + selfHeal, and the app carries the same `ignoreDifferences` on
# /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt that autodoc, casepro,
# casenotes and the rest carry, so the restart annotation is not treated as drift.
#
# This pipeline must still NOT `kubectl apply` the manifests under kubernetes/staging/ in THIS
# repo (a stale, divergent copy) nor `kubectl set image` — both fight ArgoCD's self-heal. In
# particular the committed Ingress used the wrong shared-ALB group, so applying it flipped
# MatterChat onto the backend ALB and 404-ed the public host until the binding was repaired.
# (See the repo HANDOFF / memory "matterchat-staging-argocd-truth".)
#
# Why this replaced the previous `kubectl delete pod` deploy: that version made EVERY run since
# 2026-08-05 red, for two reasons, neither of them the build.
#
#   1. RACE. `delete pod --wait=false` was followed by a curl loop that exited on the first 200 —
#      which came from the OUTGOING pod, still serving for a few seconds after the delete was
#      accepted. The gate went green on a stale pod, then `staging-smoke` hit the real gap and got
#      503. On run 31969026511 the deploy step logged `t=10s /api/info=200` at 20:01:30 and the
#      smoke got 503 at 20:02:27. All four smoke assertions are correct — /api/info, /livez and
#      /api/v1/settings.public each return 200 against a healthy pod.
#   2. DOWNTIME. At replicas:1 deleting the only pod leaves ZERO pods serving until the
#      replacement finishes Rocket.Chat's ~8 minute boot. Staging 503'd on every single deploy —
#      the opposite of what the EFS RWX uploads volume was introduced to enable.
#
# `rollout restart` fixes both. It edits the pod template, so the Deployment's own RollingUpdate
# (maxSurge=1 / maxUnavailable=0) boots the new pod alongside the old one and drains the old only
# once the new is Ready — zero downtime — and `rollout status` waits on the NEW ReplicaSet rather
# than on an HTTP code that any pod, including the one being replaced, can answer.
#
# MatterChat's default branch is `develop`; this fires ONLY on `staging`.

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  ECR_REPOSITORY: matterchat
  K8S_NAMESPACE: staging

# Avoid two overlapping builds racing on the same image/rollout.
concurrency:
  group: matterchat-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # ubuntu-latest is too small for a Meteor build (~20-35 min / 6 GB);
    # use the same large runner MatterChat's other workflows use.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha8=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/meteor/.docker/Dockerfile.alpha
          push: true
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ steps.vars.outputs.sha8 }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      # --- Deploy: the standard OmnisAI staging roll -----------------------------------------
      # NO `kubectl apply` of kubernetes/staging/* and NO `kubectl set image` (both fight ArgoCD).
      # The Deployment pins :staging-latest with imagePullPolicy: Always, so restarting the pod
      # template is what pulls the image this job just pushed.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/matterchat -n "${K8S_NAMESPACE}"
          echo "🔄 Deployment restarted in the ${K8S_NAMESPACE} namespace"

      - name: Wait for rollout to complete
        run: |
          # Waits on the NEW ReplicaSet. maxSurge=1/maxUnavailable=0 keeps the old pod serving
          # throughout, so this is zero-downtime. 20m because Rocket.Chat runs its DB migrations
          # at startup and boots slowly (~8 min is normal); kubectl returns the moment the new
          # pod is Ready.
          kubectl rollout status deployment/matterchat -n "${K8S_NAMESPACE}" --timeout=20m
          echo "✅ Rollout complete — the new pod is serving"

      - name: Confirm the running pod is the image this run built
        run: |
          set -euo pipefail
          # rollout status proves a pod came up, not that it came up on the RIGHT image. A
          # pull failure that silently reused a cached layer would otherwise pass.
          want="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="staging-${{ steps.vars.outputs.sha8 }}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          got="$(kubectl get pod -n "${K8S_NAMESPACE}" -l app=matterchat \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')"
          echo "ecr digest for staging-${{ steps.vars.outputs.sha8 }}: ${want}"
          echo "running pod imageID                        : ${got}"
          case "${got}" in
            *"${want}") echo "✅ running the image this run built" ;;
            *) echo "::error::The running pod is NOT the image this run built."; exit 1 ;;
          esac

      # On a failed roll, dump WHY the new pod did not become ready (boot crash vs scheduling vs
      # image pull) — pod state, events, and current + previous container logs.
      - name: Diagnose failed roll (pod state + crash logs)
        if: failure()
        run: |
          echo "===== argocd app ====="; kubectl -n argocd get application matterchat-staging -o jsonpath='sync={.status.sync.status} revision={.status.sync.revision} health={.status.health.status}{"\n"}' 2>&1 || true
          echo "===== pods ====="; kubectl get pods -n "${K8S_NAMESPACE}" -l app=matterchat -o wide 2>&1 || true
          echo "===== describe pod (events + state) ====="; kubectl describe pod -n "${K8S_NAMESPACE}" -l app=matterchat 2>&1 | tail -70 || true
          echo "===== current container logs ====="; kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --tail=140 2>&1 || true
          echo "===== previous (crashed) container logs ====="; kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --previous --tail=140 2>&1 || true
          echo "===== recent namespace events ====="; kubectl get events -n "${K8S_NAMESPACE}" --sort-by=.lastTimestamp 2>&1 | tail -30 || true

  # Post-deploy regression net: read-only Playwright smoke against the freshly rolled
  # staging site (login screen renders, /api/info + /livez + settings.public respond).
  # Reuses .github/workflows/staging-smoke.yml (also runnable by hand via dispatch).
  staging-smoke:
    needs: build-and-deploy
    uses: ./.github/workflows/staging-smoke.yml
