name: MatterChat — Staging Reload (apply seeded OIDC settings)

# Final step of the authorized login fix. The OIDC issuer/client_id are already seeded in Mongo,
# but Rocket.Chat's in-memory settings cache didn't hot-reload a raw DB write — so restart the app
# pod (delete it; the ArgoCD-managed Deployment recreates it) to read the seeded values on boot.
# MatterChat-scoped; ArgoCD is indifferent to individual pods.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  K8S_NAMESPACE: staging

jobs:
  reload:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure kubectl
        run: |
          which kubectl || { curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"; chmod +x kubectl; sudo mv kubectl /usr/local/bin/; }

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Confirm OIDC settings are seeded in Mongo (pre-check)
        run: |
          kubectl exec -n "${K8S_NAMESPACE}" matterchat-mongo-0 -- mongosh matterchat --quiet --eval '
            ["OmnisAI_OIDC_Issuer","OmnisAI_OIDC_Client_Id"].forEach(function(id){var s=db.rocketchat_settings.findOne({_id:id}); print(id+" => "+JSON.stringify(s.value));});
          '

      - name: Restart app pod (delete; Deployment recreates it to reload settings)
        run: kubectl delete pod -n "${K8S_NAMESPACE}" -l app=matterchat --wait=false || true

      - name: Wait for the new pod Ready + /api/info 200
        run: |
          BASE=https://matterchat.stg-omnisai.io
          for i in $(seq 1 30); do
            code=$(curl -fsS -m 6 -o /dev/null -w '%{http_code}' "$BASE/api/info" 2>/dev/null || echo 000)
            echo "t=$((i*10))s  /api/info=$code  pods=$(kubectl get pods -n ${K8S_NAMESPACE} -l app=matterchat --no-headers 2>/dev/null | awk '{print $2$3}' | tr '\n' ',')"
            [ "$code" = "200" ] && break
            sleep 10
          done

      - name: Verify login redirect (expect auth-app, NOT not_configured)
        run: |
          BASE=https://matterchat.stg-omnisai.io
          echo "=== /_omnisai/authorize ==="
          curl -sS -m 10 -o /dev/null -D - "$BASE/_omnisai/authorize" | grep -iE '^location:|^HTTP' || true
