name: MatterChat — Staging Admin Fix (authorized)

# Founder-authorized one-shot, MatterChat-scoped. Promotes the founder's accounts (phillip, john)
# to admin — the setup-wizard skip meant the "first OmnisAI user -> admin" bootstrap was already
# claimed by 'Chi', so OmnisAI logins came in as plain users. Also force Show_Setup_Wizard=completed.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  K8S_NAMESPACE: staging

jobs:
  fix:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure kubectl
        run: |
          which kubectl || { curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"; chmod +x kubectl; sudo mv kubectl /usr/local/bin/; }

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Promote phillip (by email) + john to admin; force Show_Setup_Wizard=completed
        run: |
          kubectl exec -n "${K8S_NAMESPACE}" matterchat-mongo-0 -- mongosh matterchat --quiet --eval '
            db.rocketchat_settings.updateOne({_id:"Show_Setup_Wizard"},{$set:{value:"completed", _updatedAt:new Date()}});
            // founder = phillip@omnisai.io (login is email-based; the RC username is auto-generated). Promote by email.
            var p = db.users.findOne({"emails.address":{$regex:/^phillip@omnisai\.io$/i}});
            if (p) { db.users.updateOne({_id:p._id},{$addToSet:{roles:"admin"}}); print("promote phillip@omnisai.io: username=" + p.username + " -> admin"); }
            else { print("NO user with email phillip@omnisai.io found"); }
            var rj = db.users.updateOne({username:"john"},{$addToSet:{roles:"admin"}});
            print("promote john: matched=" + rj.matchedCount + " modified=" + rj.modifiedCount);
            print("--- admins now ---");
            db.users.find({roles:"admin"},{username:1}).forEach(function(u){ print("  ADMIN: " + u.username); });
            print("Show_Setup_Wizard = " + JSON.stringify((db.rocketchat_settings.findOne({_id:"Show_Setup_Wizard"})||{}).value));
          '
