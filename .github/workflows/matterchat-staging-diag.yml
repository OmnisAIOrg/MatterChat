name: MatterChat — Staging Diagnostics

# On-demand, READ-ONLY cluster introspection for staging. No build, no deploy,
# no writes — authenticates to EKS and dumps why the matterchat pod is unhealthy
# (state + last-termination reason, current + previous container logs, OIDC env
# presence on the live Deployment, Mongo rs0 state, recent events). Trigger via:
#   gh workflow run matterchat-staging-diag.yml --ref develop
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: stg-omnisai-cluster
  K8S_NAMESPACE: staging

jobs:
  diagnose:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure kubectl
        run: |
          which kubectl || {
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          }
          kubectl version --client

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: App pods (status + restart count)
        run: kubectl get pods -n "${K8S_NAMESPACE}" -l app=matterchat -o wide || true

      - name: Describe app pod (events + last-termination reason)
        run: kubectl describe pod -n "${K8S_NAMESPACE}" -l app=matterchat 2>&1 | tail -140 || true

      - name: OmnisAI OIDC env on the LIVE Deployment (env names redacted; only non-secret OIDC values shown)
        run: |
          echo "===== all env var NAMES on container[0] (values redacted) ====="
          kubectl get deployment matterchat -n "${K8S_NAMESPACE}" \
            -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}{"\n"}{end}' | sort || true
          echo "===== OmnisAI OIDC vars name=value (non-secret config, already in the committed manifest) ====="
          kubectl get deployment matterchat -n "${K8S_NAMESPACE}" \
            -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' \
            | grep -iE 'OMNISAI|OVERWRITE_SETTING_OmnisAI' || echo ">>> NO OMNISAI / OVERWRITE_SETTING_OmnisAI env on the Deployment"

      - name: Current container logs (tail)
        run: kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --tail=200 2>&1 | tail -200 || true

      - name: Previous (crashed) container logs (tail)
        run: kubectl logs -n "${K8S_NAMESPACE}" -l app=matterchat --previous --tail=200 2>&1 | tail -200 || true

      - name: Mongo rs0 statefulset + pods
        run: |
          kubectl get statefulset matterchat-mongo -n "${K8S_NAMESPACE}" -o wide 2>&1 || true
          kubectl get pods -n "${K8S_NAMESPACE}" -l app=matterchat-mongo -o wide 2>&1 || true

      - name: Recent namespace events
        run: kubectl get events -n "${K8S_NAMESPACE}" --sort-by=.lastTimestamp 2>&1 | tail -40 || true

      - name: Deployment ownership (who manages it — GitOps/Stakater/Argo/Flux?)
        run: |
          echo "===== deployment annotations + labels (management ownership) ====="
          kubectl get deployment matterchat -n "${K8S_NAMESPACE}" -o jsonpath='{.metadata.annotations}' 2>&1 | tr ',' '\n' || true
          echo
          kubectl get deployment matterchat -n "${K8S_NAMESPACE}" -o jsonpath='{.metadata.labels}' 2>&1 | tr ',' '\n' || true
          echo "===== managedFields managers ====="
          kubectl get deployment matterchat -n "${K8S_NAMESPACE}" -o jsonpath='{range .metadata.managedFields[*]}{.manager}{" / "}{.operation}{"\n"}{end}' 2>&1 || true

      - name: Service + endpoints (does the Service point at the healthy pod?)
        run: |
          kubectl get svc matterchat -n "${K8S_NAMESPACE}" -o wide 2>&1 || true
          echo "===== endpoints (should list the healthy pod IP:3000) ====="
          kubectl get endpoints matterchat -n "${K8S_NAMESPACE}" -o wide 2>&1 || true

      - name: Ingress + ALB routing (the public 404 cause)
        run: |
          echo "===== all ingresses in namespace (shared ALB group) ====="
          kubectl get ingress -n "${K8S_NAMESPACE}" -o wide 2>&1 || true
          echo "===== matterchat ingress describe (ALB controller events/errors) ====="
          kubectl describe ingress matterchat -n "${K8S_NAMESPACE}" 2>&1 | tail -60 || true
          echo "===== group.order across all ingresses (conflict check) ====="
          kubectl get ingress -n "${K8S_NAMESPACE}" -o jsonpath='{range .items[*]}{.metadata.name}{"  order="}{.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.order}{"  group="}{.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.name}{"  host="}{.spec.rules[0].host}{"\n"}{end}' 2>&1 || true

      - name: ArgoCD app (name/ns, syncPolicy, status, does it own the ingress?)
        run: |
          echo "===== find the ArgoCD Application ====="
          kubectl get applications.argoproj.io -A 2>&1 | grep -i matterchat || echo "no matterchat app via -A"
          APPNS=$(kubectl get applications.argoproj.io -A 2>/dev/null | grep -i 'matterchat-staging' | awk '{print $1}' | head -1)
          echo "APP_NAMESPACE=${APPNS:-argocd}"
          NS="${APPNS:-argocd}"
          echo "===== syncPolicy (auto? selfHeal? prune?) + status ====="
          kubectl get application matterchat-staging -n "$NS" -o jsonpath='{"syncPolicy="}{.spec.syncPolicy}{"\nrepoURL="}{.spec.source.repoURL}{"\npath="}{.spec.source.path}{"\nsyncStatus="}{.status.sync.status}{"\nhealth="}{.status.health.status}{"\n"}' 2>&1 || true
          echo
          echo "===== resources ArgoCD manages (does it list the Ingress?) ====="
          kubectl get application matterchat-staging -n "$NS" -o jsonpath='{range .status.resources[*]}{.kind}{"/"}{.name}{" sync="}{.status}{" health="}{.health.status}{"\n"}{end}' 2>&1 | grep -iE "ingress|deployment|service" || true

      - name: Ingress ALB association (which ALB is matterchat actually bound to?)
        run: |
          kubectl get ingress matterchat -n "${K8S_NAMESPACE}" -o jsonpath='{"group.name="}{.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.order}{" / "}{.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.name}{"\nstatus.LB="}{.status.loadBalancer.ingress[0].hostname}{"\n"}' 2>&1 || true

      - name: Confirm OIDC settings exist in Mongo (my new image registers them)
        run: |
          kubectl exec -n "${K8S_NAMESPACE}" matterchat-mongo-0 -- mongosh matterchat --quiet --eval '
            ["OmnisAI_OIDC_Enabled","OmnisAI_OIDC_Issuer","OmnisAI_OIDC_Client_Id"].forEach(function(id){
              var s = db.rocketchat_settings.findOne({_id:id});
              print(id + " => exists=" + (!!s) + " value=" + (s ? JSON.stringify(s.value) : "MISSING"));
            });
          ' 2>&1 || echo "mongo read failed"

      - name: Admin + setup-wizard state (is there a real admin? founder user roles?)
        run: |
          kubectl exec -n "${K8S_NAMESPACE}" matterchat-mongo-0 -- mongosh matterchat --quiet --eval '
            print("Show_Setup_Wizard = " + JSON.stringify((db.rocketchat_settings.findOne({_id:"Show_Setup_Wizard"})||{}).value));
            print("admin count = " + db.users.countDocuments({roles:"admin"}));
            db.users.find({roles:"admin"},{username:1,roles:1}).forEach(function(u){ print("  ADMIN: " + u.username); });
            print("--- omnisai-linked users (the founder logs in via OmnisAI) ---");
            db.users.find({"services.omnisai":{$exists:true}},{username:1,roles:1,"emails.address":1}).limit(10).forEach(function(u){
              print("  user " + u.username + "  roles=" + JSON.stringify(u.roles));
            });
            print("total users = " + db.users.countDocuments({type:{$ne:"bot"}}));
          ' 2>&1 || echo "mongo read failed"
